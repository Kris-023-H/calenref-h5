# Cloudflare Workers 部署配置（静态资源 + 同源 API）
#
# 为什么需要这个文件：Workers 本身没有「构建输出目录」的概念，必须显式告诉
# wrangler 把哪个目录作为静态资源上传。缺了 [assets]，部署上去的就是源码目录，
# 浏览器会去加载 /src/main.tsx（不存在）→ 白屏。
#
# name 必须与 Cloudflare 上已有的 Worker 名一致，否则 wrangler 会新建一个 Worker，
# 域名也会变成新的。

name = "zeji-h5"
# Worker 入口：只处理 /api/*（Creem 下单与核验），其余全部交给静态资源
main = "./worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
# 相对本文件所在目录（仓库的 app/），即 vite build 的产物
directory = "./dist"
# 绑定给 Worker 用（env.ASSETS.fetch），否则 Worker 拿不到静态资源
binding = "ASSETS"
# 单页应用：未匹配到文件的路径回落到 index.html，保证深链与刷新可用
not_found_handling = "single-page-application"
# 关键：让 Worker 接管全部请求（run_worker_first = true），
# 这样才能给 HTML / 静态资源也加上安全响应头与缓存策略；
# 否则默认静态资源优先，Worker 只能看到这里列出的路径（如 /api/*）。
run_worker_first = true

[[kv_namespaces]]
# 存 ref → checkoutId 与已付标记
binding = "ORDERS"
id = "c8c45809e3ab4817b1509bc94af2394b"

[vars]
# 生产：https://api.creem.io/v1
# 测试：https://test-api.creem.io/v1（Creem 测试模式与生产数据完全隔离）
CREEM_API_BASE = "https://api.creem.io/v1"
