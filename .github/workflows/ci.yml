name: CI

# 部署走 Cloudflare Pages（Git 集成，push 即自动构建发布）。
# 这里只做质量闸门：类型检查、测试、生产构建，确保进 main 的代码是可构建的。
# 想改成 GitHub Pages 也可以，但 Pages 只能用于公开仓库，且海外访问不如 CF。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: app/dist
          retention-days: 7
