name: Deploy H5 to GitHub Pages

# 推送到 main 即构建并发布。首次使用需在仓库 Settings → Pages
# 把 Source 设为 "GitHub Actions"，否则 deploy 步骤会报 404。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Resolve deploy base and site URL
        # 项目站点是 /<repo>/，用户站点（<owner>.github.io）是根路径；
        # base 决定资源与 PWA 图标路径，site URL 决定 canonical/OG/sitemap。
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
            echo "VITE_SITE_URL=https://${REPO}" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/${REPO}/" >> "$GITHUB_ENV"
            echo "VITE_SITE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build
        env:
          # 未配置时保持空：GA4 完全不加载，不会污染真实数据
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
