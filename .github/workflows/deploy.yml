name: Deploy

# push 到 main 即部署到 Cloudflare Workers，部署完立刻跑自检。
#
# 凭据用 **Global API Key**（X-Auth-Email + X-Auth-Key），不是 API Token：
# 本账号的密钥是 cfk_ 前缀的 Global API Key，走 apiToken 参数会被 API 拒掉。
# 配置方式：仓库 Settings → Secrets and variables → Actions →
#   CLOUDFLARE_API_KEY   （Global API Key）
#   CLOUDFLARE_EMAIL     （账号邮箱）
#   CLOUDFLARE_ACCOUNT_ID（账号 ID）
# 三个都配齐才部署，否则整个 job 跳过（纯 CI 场景不受影响）。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      ${{ secrets.CLOUDFLARE_API_KEY != '' &&
          secrets.CLOUDFLARE_EMAIL != '' &&
          secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build
        env:
          # 必须指向生产域名：workers.dev 只是回源地址。
          # 写错会让 canonical / og:url / sitemap 全指向临时域名，SEO 直接受损。
          VITE_SITE_URL: https://calenref.com
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}

      - name: Deploy to Cloudflare Workers
        working-directory: app
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # 部署完等边缘节点传播，再自检；失败就是红 X，不允许「接口 200 就收工」
      - name: Wait for edge propagation
        run: sleep 90

      - name: Verify deployment
        working-directory: app
        run: node scripts/verify-deploy.mjs https://calenref.com
