name: Deploy

# push 到 main 即部署到 Cloudflare Workers，部署完立刻跑自检。
# 没有配置 CLOUDFLARE_API_TOKEN 时整个 job 跳过（纯 CI 场景不受影响），
# 配置方式：仓库 Settings → Secrets → Actions → CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build
        env:
          VITE_SITE_URL: https://zeji-h5.kris-188h.workers.dev

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: deploy

      # 部署完等边缘节点传播，再自检；失败就是红 X，不允许「接口 200 就收工」
      - name: Wait for edge propagation
        run: sleep 90

      - name: Verify deployment
        working-directory: app
        run: node scripts/verify-deploy.mjs https://zeji-h5.kris-188h.workers.dev
