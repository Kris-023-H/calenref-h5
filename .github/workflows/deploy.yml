name: Deploy

# push 到 main 即部署到 Cloudflare Workers，部署完立刻跑自检。
#
# 凭据用 **API Token**（Bearer），不是 Global API Key：
# Global API Key 是账号级全量权限，泄一次等于交出整个 Cloudflare 账号
# （其他 Worker、域名、DNS、账单全部沦陷）。CI 只配一个最小权限 Token：
#   Workers Scripts Write / Workers KV Storage Read+Write / Account Settings Read
# 本地生成：python app/scripts/cf-create-ci-token.py
# 配置方式：仓库 Settings → Secrets and variables → Actions →
#   Secrets:  CLOUDFLARE_API_TOKEN（CI 专用 Token）
#   Variables: CLOUDFLARE_EMAIL、CLOUDFLARE_ACCOUNT_ID、ENABLE_DEPLOY、VITE_GA4_ID
#
# 【关键】job 级 `if` 里**不能用 secrets 上下文**。
# GitHub 在 `jobs.<job_id>.if` 只提供 github / needs / vars / inputs；
# 一旦引用 secrets，整个 workflow 文件校验就会失败 → run 直接 0 job 报错，
# 而且 workflow 名称会退化成文件路径（"Deploy" 变成 ".github/workflows/deploy.yml"）。
# 本仓库 2026-10-29 起就是这么坏的：每次 push 都红，从没部署成功过一次。
# 所以：job 级判断只用 vars，secrets 一律放到 step 的 env 里用。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 只用 vars（github 上下文允许的），绝不碰 secrets。
    # workflow_dispatch 手动触发时无条件执行，方便补一次部署。
    if: ${{ vars.ENABLE_DEPLOY == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4.x 要求 Node >= 22，用 20 会在部署那步直接报
          # "Wrangler requires at least Node.js v22.0.0" 而失败。
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build
        env:
          # 必须指向生产域名：workers.dev 只是回源地址。
          # 写错会让 canonical / og:url / sitemap 全指向临时域名，SEO 直接受损。
          VITE_SITE_URL: https://calenref.com
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}

      - name: Deploy to Cloudflare Workers
        working-directory: app
        env:
          # API Token 认证：wrangler 读 CLOUDFLARE_API_TOKEN，目标账号由
          # CLOUDFLARE_ACCOUNT_ID 指定。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ vars.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # 部署完等边缘节点传播，再自检；失败就是红 X，不允许「接口 200 就收工」
      - name: Wait for edge propagation
        run: sleep 90

      - name: Verify deployment
        working-directory: app
        run: node scripts/verify-deploy.mjs https://calenref.com
